<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400">
  <!-- Background Gradient -->
  <defs>
    <linearGradient id="bg-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="black" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg-gradient)" rx="20" />

  <!-- Main Title -->
  <text x="50%" y="35%" text-anchor="middle" fill="white"
        font-family="Segoe UI, Arial, sans-serif" font-size="60" font-weight="bold" filter="url(#shadow)">
    Swati Jain
  </text>

  <!-- Subtitle -->
  <text x="50%" y="50%" text-anchor="middle" fill="#93c5fd"
        font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="600">
    Full Stack Software Developer
  </text>

  <!-- Divider Line -->
  <line x1="20%" y1="58%" x2="80%" y2="58%" stroke="#60a5fa" stroke-width="2" opacity="0.7"/>

  <!-- Tagline -->
  <text x="50%" y="72%" text-anchor="middle" fill="#facc15"
        font-family="Segoe UI, Arial, sans-serif" font-size="26" font-style="italic">
    🚀 Code. Solve. Build. Repeat.
  </text>

  <!-- Logos Row -->
  <!-- React -->
  <g transform="translate(400,330) scale(0.6)">
    <circle cx="0" cy="0" r="8" fill="#61DAFB"/>
    <ellipse rx="40" ry="15" stroke="#61DAFB" stroke-width="4" fill="none"/>
    <ellipse rx="40" ry="15" stroke="#61DAFB" stroke-width="4" fill="none" transform="rotate(60)"/>
    <ellipse rx="40" ry="15" stroke="#61DAFB" stroke-width="4" fill="none" transform="rotate(-60)"/>
  </g>

  <!-- Node.js -->
  <g transform="translate(520,330) scale(0.7)">
    <polygon points="0,-40 35,-20 35,20 0,40 -35,20 -35,-20" fill="#68A063"/>
    <text x="0" y="8" text-anchor="middle" fill="white" font-size="18" font-family="Arial" font-weight="bold">Node</text>
  </g>

  <!-- Java -->
  <g transform="translate(640,330) scale(0.9)">
    <path d="M0 -20 C10 -40, 30 -40, 20 -20" stroke="#f89820" stroke-width="3" fill="none"/>
    <path d="M0 -10 C15 -25, 40 -25, 20 -10" stroke="#f89820" stroke-width="3" fill="none"/>
    <path d="M0 0 C20 -10, 40 -10, 20 0" stroke="#f89820" stroke-width="3" fill="none"/>
    <ellipse cx="20" cy="10" rx="20" ry="5" stroke="#5382a1" stroke-width="4" fill="none"/>
  </g>

  <!-- Python -->
  <g transform="translate(760,330) scale(0.7)">
    <rect x="-25" y="-15" width="50" height="30" rx="8" fill="#3776ab"/>
    <rect x="-10" y="-35" width="50" height="30" rx="8" fill="#ffd43b"/>
    <circle cx="-5" cy="-20" r="4" fill="white"/>
    <circle cx="20" cy="-5" r="4" fill="white"/>
  </g>

  <!-- MongoDB -->
  <g transform="translate(880,330) scale(0.9)">
    <path d="M0 -40 Q-15 0 0 40 Q15 0 0 -40Z" fill="#4CAF50"/>
    <line x1="0" y1="-40" x2="0" y2="40" stroke="#2E7D32" stroke-width="3"/>
  </g>
</svg>
